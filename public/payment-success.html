<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement Réussi - Mystique Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600&display=swap');
    body { font-family: 'Montserrat', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-zinc-950 border border-gold-500/30 p-8 rounded-3xl max-w-md w-full text-center shadow-2xl relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-gold-500/10 rounded-full blur-2xl"></div>

    <div class="inline-flex items-center justify-center w-16 h-16 bg-green-500/10 border border-green-500/30 rounded-full text-green-400 text-3xl mb-6">
      <i class="fa-solid fa-circle-check"></i>
    </div>

    <h2 class="text-3xl font-cinzel font-bold text-white mb-2">Commande Confirmée !</h2>
    <p class="text-xs text-gray-400 mb-6" id="success-desc">Votre paiement a été validé avec succès par la plateforme MoneyFusion Pay.</p>

    <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-4 text-left space-y-3 mb-6">
      <div class="flex justify-between text-xs">
        <span class="text-gray-400">Numéro de commande :</span>
        <span class="font-bold text-white" id="order-id-label">#--</span>
      </div>
      <div class="flex justify-between text-xs">
        <span class="text-gray-400">Moyen de règlement :</span>
        <span class="font-bold text-white" id="pay-method-label">MoneyFusion Pay</span>
      </div>
      <div class="flex justify-between text-xs">
        <span class="text-gray-400">Statut du colis :</span>
        <span class="bg-gold-500/10 text-gold-400 px-2 py-0.5 rounded text-[10px] uppercase font-bold" id="status-label">En cours de préparation</span>
      </div>
    </div>

    <div class="space-y-4">
      <a href="/" class="block w-full bg-gradient-to-r from-gold-600 to-gold-500 hover:from-gold-500 hover:to-gold-400 text-black font-extrabold uppercase text-xs py-3.5 rounded-xl transition shadow-lg">
        Retourner à la boutique
      </a>
      <a id="wa-chat-link" href="#" target="_blank" class="block w-full bg-[#25D366]/20 hover:bg-[#25D366]/30 border border-[#25D366]/40 text-[#25D366] font-bold text-xs py-3.5 rounded-xl transition">
        <i class="fa-brands fa-whatsapp mr-2"></i> Contacter le support WhatsApp
      </a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get("orderId") || "";
      const isCash = urlParams.get("cash") === "true";

      document.getElementById("order-id-label").textContent = "#" + (orderId || "--");

      if (isCash) {
        document.getElementById("success-desc").textContent = "Votre commande avec paiement à la livraison a été enregistrée avec succès ! Nous vous contacterons via WhatsApp pour confirmation avant expédition.";
        document.getElementById("pay-method-label").textContent = "Paiement à la livraison";
        document.getElementById("status-label").textContent = "En attente de confirmation";
      } else if (orderId) {
        // Fetch real order status dynamically to adapt the UI
        fetch(`/api/orders/track/${orderId}`)
          .then(res => res.json())
          .then(order => {
            if (order && !order.error) {
              const method = 'Maketou Pay (Carte/Momo)';
              document.getElementById("pay-method-label").textContent = method;
              document.getElementById("success-desc").textContent = `Votre paiement a été validé avec succès par la plateforme Maketou Pay.`;
              document.getElementById("status-label").textContent = order.status || "En cours de préparation";
            }
          })
          .catch(err => {
            console.error("Failed to load order details", err);
          });
      }

      // Pre-fill Support link
      const waUrl = "https://wa.me/22964044423?text=Bonjour,%20je%20viens%20de%20passer%20la%20commande%20%23" + orderId + "%20sur%20Mystique%20Shop.";
      document.getElementById("wa-chat-link").href = waUrl;
    });
  </script>
</body>
</html>
